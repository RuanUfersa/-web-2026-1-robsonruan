<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIFU Biblioteca UFERSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#082853] to-[#14C286] min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#082853] mb-2">📚 SIFU Biblioteca UFERSA</h1>
            <p class="text-gray-600">Faça login para acessar o sistema</p>
        </div>
        
        <div id="error-message" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-xl"></div>
        
        <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 p-4 bg-white border-2 border-gray-200 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-all font-semibold">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Entrar com Google
        </button>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            Ao fazer login, você concorda com os termos de uso do sistema.
        </div>
    </div>

    <script>
        const config = {
            domain: 'auth-salas.auth.us-east-1.amazoncognito.com',
            clientId: '6kgkftt1cbk54jveeljh1h1tcs',
            redirectUri: encodeURIComponent('https://gerenciador-salas.robsonruan.sifu1.web.ufersa.dev.br/'),
            scopes: encodeURIComponent('openid email profile')
        };

        function handleGoogleLogin() {
            const url = `https://${config.domain}/oauth2/authorize?response_type=code&client_id=${config.clientId}&redirect_uri=${config.redirectUri}&scope=${config.scopes}&identity_provider=Google`;
            window.location.href = url;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            sessionStorage.setItem('auth_code', code);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
